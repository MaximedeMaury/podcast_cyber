<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber & IA Hebdo | Podcast</title>
    <style>
        :root {
            --bg-dark: #09090b;
            --glass: rgba(24, 24, 27, 0.7);
            --neon-blue: #0ea5e9;
            --text-main: #f8fafc;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0; padding: 40px 20px;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 80% 20%, #164e63 0%, var(--bg-dark) 50%);
            color: var(--text-main);
            display: flex; justify-content: center; min-height: 100vh;
        }
        .container { width: 100%; max-width: 700px; }
        .glass-panel {
            background: var(--glass);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 24px; padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }
        .header { display: flex; gap: 25px; align-items: center; margin-bottom: 35px; }
        .cover-art {
            width: 130px; height: 130px; border-radius: 16px;
            background: linear-gradient(135deg, #0ea5e9, #3b82f6);
            box-shadow: 0 10px 30px rgba(14, 165, 233, 0.3);
            flex-shrink: 0;
        }
        .badge {
            background: var(--neon-blue); color: #000;
            padding: 4px 12px; border-radius: 12px;
            font-weight: 800; font-size: 0.75rem; letter-spacing: 1px;
            display: inline-block; margin-bottom: 5px;
        }
        h1 { margin: 10px 0 5px; font-size: 2.2rem; letter-spacing: -1px; }
        .subtitle { color: #94a3b8; font-size: 1rem; margin: 0; }
        
        /* Styles pour les épisodes générés dynamiquement */
        .player-section {
            padding-top: 30px;
            margin-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .player-section h3 { margin: 0 0 5px 0; color: var(--neon-blue); }
        .description { color: #cbd5e1; line-height: 1.6; font-size: 0.95rem; margin-bottom: 25px; }
        audio { width: 100%; border-radius: 12px; outline: none; margin-top: 10px; }
        .loading { text-align: center; color: #94a3b8; padding: 20px; }
    </style>
</head>
<body>
<div class="container">
    <div class="glass-panel">
        <div class="header">
            <div class="cover-art"></div>
            <div>
                <span class="badge">NOUVEL ÉPISODE</span>
                <h1>Cyber & IA Hebdo</h1>
                <p class="subtitle">L'actualité tech décryptée par Antigravity</p>
            </div>
        </div>

        <!-- C'est ici que JavaScript va injecter les épisodes depuis Supabase -->
        <div id="liste-podcasts">
            <div class="loading">Chargement de vos épisodes Cloud... ⏳</div>
        </div>
    </div>
</div>

<script>
    async function chargerEpisodes() {
        try {
            const reponse = await fetch('/api/episodes');
            const episodes = await reponse.json();
            
            const conteneur = document.getElementById('liste-podcasts');
            conteneur.innerHTML = ''; 
            
            if (episodes.length === 0) {
                conteneur.innerHTML = '<div class="loading">Aucun épisode publié pour le moment.</div>';
                return;
            }

            // On crée un lecteur audio pour chaque fichier trouvé sur Supabase
            episodes.forEach(ep => {
                const section = document.createElement('div');
                section.className = 'player-section';
                section.innerHTML = `
                    <h3>${ep.titre}</h3>
                    <p class="description">📅 Publié le ${ep.date}</p>
                    <audio controls preload="metadata">
                        <source src="${ep.url}" type="audio/mpeg">
                        Votre navigateur ne supporte pas la lecture audio.
                    </audio>
                `;
                conteneur.appendChild(section);
            });
        } catch (erreur) {
            document.getElementById('liste-podcasts').innerHTML = 
                '<div class="loading" style="color: #ef4444;">Erreur de connexion avec le serveur.</div>';
        }
    }
    
    chargerEpisodes();
</script>
</body>
</html>
